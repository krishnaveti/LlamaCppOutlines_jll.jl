name: Build CPU & GPU Artifacts (Linux/macOS/Windows)

on:
  workflow_dispatch:
    inputs:
      LLAMA_REPO:
        description: "llama.cpp repo"
        default: "https://github.com/ggml-org/llama.cpp.git"
        required: true
      LLAMA_REF:
        description: "llama.cpp ref"
        default: "b6729"
        required: true
      OUTLINES_REPO:
        description: "outlines-core repo"
        default: "https://github.com/dottxt-ai/outlines-core.git"
        required: true
      OUTLINES_REF:
        description: "outlines-core ref"
        default: "main"
        required: true

permissions:
  contents: read

env:
  LLAMA_REPO: ${{ inputs.LLAMA_REPO }}
  LLAMA_REF: ${{ inputs.LLAMA_REF }}
  OUTLINES_REPO: ${{ inputs.OUTLINES_REPO }}
  OUTLINES_REF: ${{ inputs.OUTLINES_REF }}

defaults:
  run:
    shell: bash

jobs:
  # ------------------------------------------------------------
  # Linux x64 CPU build
  # ------------------------------------------------------------
  linux-x64-cpu:
    runs-on: ubuntu-22.04
    env:
      TRIPLET: x86_64-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git cmake ninja-build build-essential pkg-config curl patchelf ca-certificates libcurl4-openssl-dev

      - name: Fetch vendors
        run: |
          set -eux
          rm -rf vendors && mkdir -p vendors
          git clone --depth 1 --branch "$LLAMA_REF"    "$LLAMA_REPO"    vendors/llama.cpp
          git clone --depth 1 --branch "$OUTLINES_REF" "$OUTLINES_REPO" vendors/outlines-core

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build outlines-core
        working-directory: vendors/outlines-core
        run: |
          source $HOME/.cargo/env
          RTGT=x86_64-unknown-linux-gnu
          cargo build --release --target="${RTGT}"
          mkdir -p "$GITHUB_WORKSPACE/stage/${TRIPLET}/lib"
          cp "target/${RTGT}/release/liboutlines_core.so" "$GITHUB_WORKSPACE/stage/${TRIPLET}/lib/"

      - name: Build llama.cpp (CPU)
        working-directory: vendors/llama.cpp
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON -DLLAMA_BUILD_SHARED_LIB=ON \
            -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_SERVER=ON \
            -DGGML_CUDA=OFF -DGGML_METAL=OFF -DGGML_VULKAN=OFF -DGGML_SYCL=OFF \
            -DLLAMA_CURL=ON -DGGML_NATIVE=OFF
          cmake --build build --parallel
          cmake --install build --prefix "$GITHUB_WORKSPACE/stage/${TRIPLET}"

      - name: Pack
        run: |
          cd "$GITHUB_WORKSPACE/stage/${TRIPLET}"
          tar -czf "$GITHUB_WORKSPACE/${TRIPLET}-cpu.tar.gz" .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TRIPLET }}-cpu
          path: ${{ env.TRIPLET }}-cpu.tar.gz

  # ------------------------------------------------------------
  # Linux x64 CUDA build (NVIDIA container)
  # ------------------------------------------------------------
  linux-x64-cuda:
    runs-on: ubuntu-22.04
    container:
      image: nvidia/cuda:12.4.1-devel-ubuntu22.04
      options: --user 0:0
    env:
      TRIPLET: x86_64-linux-gnu
      CMAKE_CUDA_ARCHS: 70;75;80;86;89;90
    steps:
      - uses: actions/checkout@v4

      - name: deps
        run: |
          set -eux
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git cmake ninja-build build-essential pkg-config curl patchelf ca-certificates libcurl4-openssl-dev

      - name: Fetch vendors
        run: |
          set -eux
          rm -rf vendors && mkdir -p vendors
          git clone --depth 1 --branch "$LLAMA_REF"    "$LLAMA_REPO"    vendors/llama.cpp
          git clone --depth 1 --branch "$OUTLINES_REF" "$OUTLINES_REPO" vendors/outlines-core

      - name: Install Rust
        run: |
          set -eux
          curl -L https://sh.rustup.rs -sSf | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Build outlines-core
        working-directory: vendors/outlines-core
        run: |
          set -eux
          RTGT=x86_64-unknown-linux-gnu
          cargo build --release --target="${RTGT}"
          mkdir -p "$GITHUB_WORKSPACE/stage/${TRIPLET}/lib"
          cp "target/${RTGT}/release/liboutlines_core.so" "$GITHUB_WORKSPACE/stage/${TRIPLET}/lib/"

      - name: Build llama.cpp (CUDA)
        working-directory: vendors/llama.cpp
        run: |
          set -eux
          # Link against CUDA stubs (no GPU driver in CI)
          sudo ln -sf /usr/local/cuda/lib64/stubs/libcuda.so /usr/local/cuda/lib64/stubs/libcuda.so.1
          export LD_LIBRARY_PATH=/usr/local/cuda/lib64/stubs:${LD_LIBRARY_PATH:-}
          export CMAKE_LIBRARY_PATH=/usr/local/cuda/lib64/stubs:${CMAKE_LIBRARY_PATH:-}
          
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON -DLLAMA_BUILD_SHARED_LIB=ON \
            -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_SERVER=ON \
            -DLLAMA_CURL=ON -DGGML_CUDA=ON -DGGML_NATIVE=OFF \
            -DCMAKE_CUDA_ARCHITECTURES="${CMAKE_CUDA_ARCHS}" \
            -DCMAKE_EXE_LINKER_FLAGS="-L/usr/local/cuda/lib64/stubs" \
            -DCMAKE_SHARED_LINKER_FLAGS="-L/usr/local/cuda/lib64/stubs"
          
          cmake --build build --parallel
          cmake --install build --prefix "$GITHUB_WORKSPACE/stage/${TRIPLET}"

      - name: Pack
        run: |
          set -eux
          cd "$GITHUB_WORKSPACE/stage/${TRIPLET}"
          tar -czf "$GITHUB_WORKSPACE/${TRIPLET}-cuda.tar.gz" .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TRIPLET }}-cuda
          path: ${{ env.TRIPLET }}-cuda.tar.gz

  # ------------------------------------------------------------
  # macOS Metal build (Intel + ARM)
  # ------------------------------------------------------------
  mac-metal:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-13
            triplet: x86_64-apple-darwin
          - os: macos-14
            triplet: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      TRIPLET: ${{ matrix.triplet }}
    steps:
      - uses: actions/checkout@v4

      - name: deps
        run: |
          brew update
          brew install cmake ninja || true

      - name: Fetch vendors
        run: |
          set -eux
          rm -rf vendors && mkdir -p vendors
          git clone --depth 1 --branch "$LLAMA_REF"    "$LLAMA_REPO"    vendors/llama.cpp
          git clone --depth 1 --branch "$OUTLINES_REF" "$OUTLINES_REPO" vendors/outlines-core

      - name: Rust
        run: |
          set -eux
          curl -L https://sh.rustup.rs -sSf | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          if [[ "${TRIPLET}" == "x86_64-apple-darwin" ]]; then
            $HOME/.cargo/bin/rustup target add x86_64-apple-darwin
          else
            $HOME/.cargo/bin/rustup target add aarch64-apple-darwin
          fi

      - name: Build outlines-core
        working-directory: vendors/outlines-core
        run: |
          source $HOME/.cargo/env
          RTGT=$([[ "${TRIPLET}" == "x86_64-apple-darwin" ]] && echo x86_64-apple-darwin || echo aarch64-apple-darwin)
          cargo build --release --target="${RTGT}"
          mkdir -p "$GITHUB_WORKSPACE/stage/${TRIPLET}/lib"
          cp "target/${RTGT}/release/liboutlines_core.dylib" "$GITHUB_WORKSPACE/stage/${TRIPLET}/lib/"

      - name: Build llama.cpp (Metal)
        working-directory: vendors/llama.cpp
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON -DLLAMA_BUILD_SHARED_LIB=ON \
            -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_SERVER=ON \
            -DLLAMA_CURL=ON -DGGML_METAL=ON -DGGML_NATIVE=OFF
          cmake --build build --parallel
          cmake --install build --prefix "$GITHUB_WORKSPACE/stage/${TRIPLET}"
          # include default.metallib if present
          find build -name "default.metallib" -exec mkdir -p "$GITHUB_WORKSPACE/stage/${TRIPLET}/lib" \; \
            -exec cp {} "$GITHUB_WORKSPACE/stage/${TRIPLET}/lib/default.metallib" \; || true

      - name: codesign (adhoc)
        run: |
          find "$GITHUB_WORKSPACE/stage/${TRIPLET}" -type f \( -name "*.dylib" -o -perm +111 \) -print0 | \
          xargs -0 -I{} codesign --force -s - "{}" || true

      - name: Pack
        run: |
          cd "$GITHUB_WORKSPACE/stage/${TRIPLET}"
          tar -czf "$GITHUB_WORKSPACE/${TRIPLET}-metal.tar.gz" .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TRIPLET }}-metal
          path: ${{ env.TRIPLET }}-metal.tar.gz

  # ------------------------------------------------------------
  # Windows (CPU + CUDA)
  # ------------------------------------------------------------
  windows:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        backend: [cpu, cuda]
    env:
      TRIPLET: x86_64-w64-mingw32
      BUILD_TYPE: Release
    steps:
      - uses: actions/checkout@v4

      - name: Fetch vendors
        shell: pwsh
        run: |
          if (Test-Path vendors) { Remove-Item -Recurse -Force vendors }
          git clone --depth 1 --branch "${{ env.LLAMA_REF }}"    "${{ env.LLAMA_REPO }}"    vendors/llama.cpp
          git clone --depth 1 --branch "${{ env.OUTLINES_REF }}" "${{ env.OUTLINES_REPO }}" vendors/outlines-core

      - name: Setup CUDA (CUDA job only)
        if: matrix.backend == 'cuda'
        uses: Jimver/cuda-toolkit@v0.2.18
        with:
          cuda: '12.4.1'

      - name: MSVC env + CMake + Ninja
        uses: ilammy/msvc-dev-cmd@v1

      - name: Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build outlines-core (dll)
        shell: pwsh
        working-directory: vendors/outlines-core
        run: |
          cargo build --release --target x86_64-pc-windows-msvc
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\stage\${{ env.TRIPLET }}\bin" | Out-Null
          Copy-Item "target\x86_64-pc-windows-msvc\release\outlines_core.dll" "$env:GITHUB_WORKSPACE\stage\${{ env.TRIPLET }}\bin\"

      - name: Build llama.cpp (${{ matrix.backend }})
        shell: pwsh
        working-directory: vendors/llama.cpp
        run: |
          $cudaFlag = if ("${{ matrix.backend }}" -eq "cuda") { "-DGGML_CUDA=ON" } else { "-DGGML_CUDA=OFF" }
          cmake -S . -B build -G "Ninja" `
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
            -DBUILD_SHARED_LIBS=ON -DLLAMA_BUILD_SHARED_LIB=ON `
            -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_SERVER=ON `
            -DLLAMA_CURL=OFF `
            $cudaFlag -DGGML_NATIVE=OFF
          cmake --build build --config ${{ env.BUILD_TYPE }}
          cmake --install build --prefix "$env:GITHUB_WORKSPACE\stage\${{ env.TRIPLET }}"

      - name: Pack
        shell: pwsh
        run: |
          Compress-Archive -Path "$env:GITHUB_WORKSPACE\stage\${{ env.TRIPLET }}\*" `
            -DestinationPath "$env:GITHUB_WORKSPACE\${{ env.TRIPLET }}-${{ matrix.backend }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TRIPLET }}-${{ matrix.backend }}
          path: ${{ env.TRIPLET }}-${{ matrix.backend }}.zip
